<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        #s1 .stack {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding-bottom: 180px;
        }
        #s1 .sun-wrap {
          position: relative;
          width: 320px;
          height: 320px;
          margin-bottom: 10px;
        }
        #s1 .sun-wrap svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        #s1 .kicker {
          font-size: 34px;
          letter-spacing: 0.22em;
          color: var(--sun);
          margin-bottom: 24px;
        }
        #s1 .line {
          display: block;
          font-size: 270px;
          color: var(--cream);
          text-align: center;
        }
        #s1 .chip {
          margin-top: 40px;
          padding: 14px 30px;
          border: 3px solid var(--cream);
          font-size: 30px;
          color: var(--cream);
        }
      </style>

      <div id="root" data-composition-id="s1-open" data-width="1080" data-height="1920">
        <div id="s1" class="scene">
          <div class="stack">
            <div class="sun-wrap">
              <svg viewBox="0 0 380 380">
                <g id="s1-rays" style="transform-origin: 190px 190px">
                  <g stroke="#ffc542" stroke-width="12" stroke-linecap="round">
                    <line x1="190" y1="10" x2="190" y2="60" />
                    <line x1="190" y1="320" x2="190" y2="370" />
                    <line x1="10" y1="190" x2="60" y2="190" />
                    <line x1="320" y1="190" x2="370" y2="190" />
                    <line x1="63" y1="63" x2="98" y2="98" />
                    <line x1="282" y1="282" x2="317" y2="317" />
                    <line x1="63" y1="317" x2="98" y2="282" />
                    <line x1="282" y1="98" x2="317" y2="63" />
                  </g>
                </g>
                <circle id="s1-sun" cx="190" cy="190" r="100" fill="#ffc542" />
              </svg>
            </div>
            <div class="kicker mono" id="s1-kicker">SALTLINE WEATHER CENTER</div>
            <span class="line display" id="s1-l1">Weekend</span>
            <span class="line display" id="s1-l2">Forecast</span>
            <div class="chip mono" id="s1-chip">SAT–SUN · ALL COASTS</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s1 .sun-wrap", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0);
        tl.fromTo("#s1-rays", { rotation: 0 }, { rotation: 60, duration: 2.8, ease: "none" }, 0);
        tl.fromTo("#s1-kicker", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.25);
        tl.fromTo("#s1-l1", { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.4);
        tl.fromTo("#s1-l2", { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.62);
        tl.fromTo("#s1-chip", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 1.0);
        tl.fromTo("#s1 .stack", { y: 0, opacity: 1 }, { y: -80, opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, 2.45);
        window.__timelines["s1-open"] = tl;
      </script>
    </template>
  </body>
</html>
