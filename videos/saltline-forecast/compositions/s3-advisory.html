<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        #s3 .bg {
          position: absolute;
          inset: 0;
          background: var(--coral);
        }
        #s3 .hazard {
          position: absolute;
          left: -100px;
          width: 1500px;
          height: 70px;
          background: repeating-linear-gradient(-45deg, var(--sun) 0 40px, var(--navy) 40px 80px);
        }
        #s3 .hazard.top {
          top: 240px;
        }
        #s3 .hazard.bottom {
          top: 1430px;
        }
        #s3 .content {
          position: absolute;
          left: 80px;
          top: 380px;
          width: 860px;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 34px;
        }
        #s3 .alert-tag {
          display: block;
          padding: 12px 24px;
          background: var(--sun);
          color: var(--navy);
          font-size: 32px;
        }
        #s3 .headline {
          display: flex;
          flex-direction: column;
        }
        #s3 .headline span {
          display: block;
          font-size: 200px;
          color: var(--cream);
        }
        #s3 .detail {
          font-size: 40px;
          font-weight: 700;
          line-height: 1.25;
          color: var(--cream);
          max-width: 820px;
        }
        #s3 .uv {
          font-size: 30px;
          color: var(--navy);
          background: var(--cream);
          padding: 10px 20px;
        }
        #s3 .flash {
          position: absolute;
          inset: 0;
          background: var(--cream);
        }
      </style>

      <div id="root" data-composition-id="s3-advisory" data-width="1080" data-height="1920">
        <div id="s3" class="scene">
          <div class="bg"></div>
          <div class="hazard top" id="s3-hz1" data-layout-allow-overflow></div>
          <div class="hazard bottom" id="s3-hz2" data-layout-allow-overflow></div>
          <div class="content">
            <span class="alert-tag mono" id="s3-tag">⚠ WEATHER ALERT</span>
            <div class="headline display">
              <span id="s3-h1">Swimsuit</span>
              <span id="s3-h2">Advisory</span>
              <span id="s3-h3">In Effect</span>
            </div>
            <div class="detail" id="s3-detail">The new Saltline summer collection has landed on every coast.</div>
            <span class="uv mono" id="s3-uv">UV INDEX: UNBOTHERED</span>
          </div>
          <div class="flash" id="s3-flash" data-layout-allow-occlusion></div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s3-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
        tl.fromTo("#s3-hz1", { x: -160 }, { x: 0, duration: 2.8, ease: "none" }, 0);
        tl.fromTo("#s3-hz2", { x: 0 }, { x: -160, duration: 2.8, ease: "none" }, 0);
        tl.fromTo("#s3-tag", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.1);
        tl.fromTo("#s3-tag", { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.5);
        ["#s3-h1", "#s3-h2", "#s3-h3"].forEach((id, n) => {
          tl.fromTo(id, { x: n % 2 ? 160 : -160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.2 + n * 0.16);
        });
        tl.fromTo("#s3-detail", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.85);
        tl.fromTo("#s3-uv", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 1.15);
        tl.fromTo("#s3 .content", { scale: 1, opacity: 1 }, { scale: 0.94, opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 2.5);
        window.__timelines["s3-advisory"] = tl;
      </script>
    </template>
  </body>
</html>
