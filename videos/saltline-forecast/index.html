<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ocean: #0e4d6e;
        --ocean-deep: #0a3a55;
        --navy: #0b2236;
        --cream: #fff4e0;
        --sun: #ffc542;
        --sand: #f2d7a1;
        --coral: #c2412c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ocean);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Montserrat, sans-serif;
        color: var(--cream);
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .display {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        line-height: 0.88;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="bg-slot"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="15"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s1-open-slot"
        data-composition-id="s1-open"
        data-composition-src="compositions/s1-open.html"
        data-start="0"
        data-duration="2.8"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s2-map-slot"
        data-composition-id="s2-map"
        data-composition-src="compositions/s2-map.html"
        data-start="2.8"
        data-duration="6.8"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s3-advisory-slot"
        data-composition-id="s3-advisory"
        data-composition-src="compositions/s3-advisory.html"
        data-start="9.6"
        data-duration="2.8"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s4-endcard-slot"
        data-composition-id="s4-endcard"
        data-composition-src="compositions/s4-endcard.html"
        data-start="12.4"
        data-duration="2.6"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="chrome-slot"
        data-composition-id="chrome"
        data-composition-src="compositions/chrome.html"
        data-start="0"
        data-duration="15"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
