 * Elbow/knee values are RELATIVE bends. torso: 0 upright, + leans forward. head: + nods forward.
 * Poses: idle, idleB, walkA, walkB, runA, runB, crouch, cover, holdOn, point, talk, shrug, think, reach,

  const POSES = {
    idle: { torso: 0, head: 0, lsh: -8, lel: 6, rsh: 8, rel: 6, lhip: -6, lkn: 2, rhip: 6, rkn: 2, dy: 0 },

    cover: { torso: 42, head: 26, lsh: 150, lel: 45, rsh: 160, rel: 50, lhip: 100, lkn: -128, rhip: 88, rkn: -122, dy: 64 },
    holdOn: { torso: 36, head: 20, lsh: 160, lel: 50, rsh: 82, rel: -4, lhip: 100, lkn: -128, rhip: 88, rkn: -122, dy: 64 },

    carry: { torso: 8, head: -2, lsh: 70, lel: 70, rsh: 80, rel: 65, lhip: -14, lkn: 10, rhip: 16, rkn: 10, dy: 0 },
    wave: { torso: -2, head: -6, lsh: -10, lel: 8, rsh: 160, rel: 25, lhip: -6, lkn: 2, rhip: 6, rkn: 2, dy: 0 },
    waveB: { torso: -2, head: -6, lsh: -10, lel: 8, rsh: 150, rel: -25, lhip: -6, lkn: 2, rhip: 6, rkn: 2, dy: 0 },

    brace: { torso: 6, head: 6, lsh: -55, lel: 30, rsh: 55, rel: 30, lhip: -26, lkn: 22, rhip: 26, rkn: 22, dy: 14 },
  };

  function mix(base, over) {

  }

  // as pen-drawn. Static: call once at build time. opts: { stroke, width, fill, seed, wobble, double, opacity }

    path(parent, pts, o) {

    },
    line(parent, x1, y1, x2, y2, o) {
      return sk.path(parent, [[x1, y1], [x2, y2]], o);
    },
    rect(parent, x, y, w, h, o) {
      return sk.path(parent, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], Object.assign({ closed: true }, o));
    },
    poly(parent, pts, o) {
      return sk.path(parent, pts, Object.assign({ closed: true }, o));
    },
    circle(parent, cx, cy, r, o) {
      const n = Math.max(12, Math.round(r / 4));
      const pts = [];
      for (let i = 0; i < n; i++) pts.push([cx + Math.cos((i / n) * Math.PI * 2) * r, cy + Math.sin((i / n) * Math.PI * 2) * r]);

    },
    hatch(parent, x, y, w, h, o) {

      o = o || {};

    const body = el("g", {}, g);
    const line = { stroke: INK, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" };

    P.larmOut = el("path", line, body);
    P.larmFill = el("path", Object.assign({}, line, { stroke: who === "drizzle" ? palette.slickerShade : palette.cardigan }), body);
    P.larmHand = el("path", line, body);
    P.bag = el("g", {}, body);
    P.coat = el("path", { fill: who === "drizzle" ? palette.slicker : palette.cardigan, stroke: INK, "stroke-linejoin": "round" }, body);
    P.coatDetail = el("path", Object.assign({}, line, { opacity: 0.55 }), body);
    P.rleg = el("path", line, body);
    P.bootL = el("ellipse", { fill: INK }, body);
    P.bootR = el("ellipse", { fill: INK }, body);

    P.rarmFill = el("path", Object.assign({}, line, { stroke: who === "drizzle" ? palette.slicker : palette.cardigan }), body);
    P.rarmHand = el("path", line, body);

    P.hoodRimInk = el("path", line, headG);

    P.eyeR = el("circle", { fill: INK }, headG);

    el("line", { x1: 6, y1: 0, x2: 15, y2: 0, stroke: INK, "stroke-width": 2 }, P.radio);
    el("line", { x1: 12, y1: -13, x2: 22, y2: -40, stroke: INK, "stroke-width": 3, "stroke-linecap": "round" }, P.radio);
    el("path", { d: "M20 6 l 10 4 l -3 8", stroke: INK, "stroke-width": 3, fill: "none", "stroke-linecap": "round" }, P.radio);
    // go-bag (Drizzle, worn on the back)
    el("rect", { x: -26, y: -34, width: 40, height: 58, rx: 8, fill: palette.slate, stroke: INK, "stroke-width": 3 }, P.bag);
    el("rect", { x: -22, y: -6, width: 32, height: 18, rx: 4, fill: palette.steel, stroke: INK, "stroke-width": 2 }, P.bag);

    const fig = {
      g, who,
      state: Object.assign({ x: 960, y: 640, scale: 1, facing: 1, face: "neutral", talk: false, shadow: 1, bag: false, radio: who === "mags" }, POSES.idle, opts.pose ? mix(opts.pose) : {}, opts),
      joints: {},
      time: 0,
      hand(side) { return this.joints[side === "l" ? "lhand" : "rhand"]; },
      foot(side) { return this.joints[side === "l" ? "lfoot" : "rfoot"]; },
      headPos() { return this.joints.head; },
      draw(t) {
        if (t !== undefined) this.time = t;
        const s = this.state, f = s.facing >= 0 ? 1 : -1, sc = s.scale;
        const step = Math.floor(this.time * 8);
        const j = (i) => hash(step * 31 + i) * 1.2;
        const hunch = who === "mags" ? 7 : 0;
        const torsoA = s.torso + hunch;
        const W = (lp, i) => [s.x + lp[0] * sc * f + j(i), s.y + lp[1] * sc + j(i + 50)];
        const hip = [0, s.dy];
        const td = [Math.sin((torsoA * Math.PI) / 180), -Math.cos((torsoA * Math.PI) / 180)];
        const shoulder = [hip[0] + td[0] * L.torso, hip[1] + td[1] * L.torso];
        const neckTop = [shoulder[0] + td[0] * L.neck, shoulder[1] + td[1] * L.neck];
        const headC = [neckTop[0] + td[0] * L.head, neckTop[1] + td[1] * L.head];
        const dir = (a) => [Math.sin((a * Math.PI) / 180), Math.cos((a * Math.PI) / 180)];
        const limb = (root, a1, a2, l1, l2) => {
          const d1 = dir(a1), mid = [root[0] + d1[0] * l1, root[1] + d1[1] * l1];
          const d2 = dir(a1 + a2), end = [mid[0] + d2[0] * l2, mid[1] + d2[1] * l2];
          return [mid, end];
        };
        const sh = [shoulder[0] - td[0] * 8, shoulder[1] - td[1] * 8];
        const [lelb, lhand] = limb(sh, s.lsh + torsoA, s.lel, L.upArm, L.loArm);
        const [relb, rhand] = limb(sh, s.rsh + torsoA, s.rel, L.upArm, L.loArm);
        const [lkn, lfoot] = limb(hip, s.lhip, s.lkn, L.upLeg, L.loLeg);
        const [rkn, rfoot] = limb(hip, s.rhip, s.rkn, L.upLeg, L.loLeg);

        const D = (arr) => "M" + arr.map((p) => f1(p[0]) + " " + f1(p[1])).join(" L");

        P.lleg.setAttribute("d", D(pts([hip, lkn, lfoot], 1)));
        P.rleg.setAttribute("d", D(pts([hip, rkn, rfoot], 4)));

        P.lleg.setAttribute("opacity", 0.85);
        const fl = W(lfoot, 3), fr = W(rfoot, 6);
        [[P.bootL, fl], [P.bootR, fr]].forEach(([e, p]) => {

          e.setAttribute("rx", f1(13 * sc)); e.setAttribute("ry", f1(7 * sc));
        });
        // arms: ink outline (wide) + sleeve color (narrower) for the upper+lower arm, hand stub in ink
        const sleeveEnd = (elb, hand) => [elb[0] + (hand[0] - elb[0]) * 0.82, elb[1] + (hand[1] - elb[1]) * 0.82];
        const armDraw = (out, fill, hand, elb, hd, i0) => {
          const se = sleeveEnd(elb, hd);
          const p = pts([sh, elb, se], i0);
          out.setAttribute("d", D(p)); out.setAttribute("stroke-width", f1(sw * 2.6));
          fill.setAttribute("d", D(p)); fill.setAttribute("stroke-width", f1(sw * 1.7));

        armDraw(P.rarmOut, P.rarmFill, P.rarmHand, relb, rhand, 20);

        // coat: a trapezoid hung from the shoulders along the torso, hem below the hip
        const nrm = [-td[1], td[0]];
        const coatLen = who === "drizzle" ? 1.22 : 1.0;
        const hem = [shoulder[0] - td[0] * L.torso * coatLen, shoulder[1] - td[1] * L.torso * coatLen];
        const topW = 24, hemW = who === "drizzle" ? 40 : 32;
        const cpts = [
          [sh[0] + nrm[0] * topW, sh[1] + nrm[1] * topW], [sh[0] - nrm[0] * topW, sh[1] - nrm[1] * topW],

            const u = k / 4, cx = sh[0] + (hem[0] - sh[0]) * u + nrm[0] * 4, cy = sh[1] + (hem[1] - sh[1]) * u + nrm[1] * 4;
            const a = W([cx - nrm[0] * 9, cy - nrm[1] * 9], 44 + k), b = W([cx + nrm[0] * 9, cy + nrm[1] * 9], 48 + k);
            det += ` M${f1(a[0])} ${f1(a[1])} L${f1(b[0])} ${f1(b[1])}`;

          const a = W([pc[0] - 9, pc[1] - 7], 52), b = W([pc[0] + 9, pc[1] + 9], 53);
          det += ` M${f1(a[0])} ${f1(a[1])} L${f1(b[0])} ${f1(a[1])} L${f1(b[0])} ${f1(b[1])} L${f1(a[0])} ${f1(b[1])} Z`;

    ROCKS.forEach((k) => {
      let x, y, rot = 0, op = 1;
      if (t < k.t0 - 0.35) { x = k.x0; y = TY(k.x0) - 36 - k.r * 0.5; } // sitting in the cut bank
      else if (t < k.t0) { const u = (t - (k.t0 - 0.35)) / 0.35; x = k.x0; y = TY(k.x0) - 36 - k.r * 0.5 + u * u * (36 + k.r * 0.5 + k.off - k.r); rot = -u * 40; }
      else {
        const u = clamp01((t - k.t0) / (k.t1 - k.t0)), e = 1 - (1 - u) * (1 - u);
        x = k.x0 + (k.x1 - k.x0) * e;
        const hop = Math.abs(Math.sin(u * Math.PI * 4)) * 14 * (1 - u) * (k.r / 14);
        y = TY(x) + k.off - k.r - hop;
        rot = -40 - ((k.x0 - x) / k.r) * (180 / Math.PI);
        if (k.fall && u >= 1) { // tumbles off the downhill edge into the ferns
          const v = t - k.t1;
          x = k.x1 - v * 70; y = TY(k.x1) + k.off - k.r + v * v * 900; rot -= v * 500;
          op = clamp01(1 - (y - TY(k.x1)) / 260);
        }
      }
      k.g.setAttribute("transform", `translate(${f1(x)} ${f1(y)}) rotate(${rot.toFixed(1)})`);
      k.g.setAttribute("opacity", op.toFixed(3));
    });
  };

  // fir needles / twigs shaken out of the canopy
  const NEEDLES = [];
  for (let i = 0; i < 10; i++) {
    const g = el("g", { opacity: 0 }, fxL);
    sk.path(g, [[-7, -6], [0, 0], [7, -7]], { stroke: P.night, width: 2.5, seed: 60 + i, double: false, wobble: 0.4 });
    sk.line(g, 0, 0, 0, 9, { stroke: P.night, width: 2, seed: 80 + i, double: false });
    NEEDLES.push({ g, x: 1120 + ((i * 157) % 640), y0: 220 + Math.abs(H(i + 5)) * 220, t0: QS + 0.3 + i * 0.45, sp: 120 + Math.abs(H(i + 9)) * 80 });
  }
  const drawNeedles = (t) => {
    NEEDLES.forEach((n, i) => {
      const v = t - n.t0;
      if (v < 0 || v > 6) { n.g.setAttribute("opacity", 0); return; }
      const y = n.y0 + v * n.sp, x = n.x + Math.sin(v * 2.4 + i) * 24 - v * 10;
      n.g.setAttribute("transform", `translate(${f1(x)} ${f1(y)}) rotate(${(Math.sin(v * 3 + i) * 40).toFixed(1)})`);
      n.g.setAttribute("opacity", (clamp01(v / 0.2) * clamp01((TY(x) - 20 - y) / 60) * 0.9).toFixed(3));
    });
  };

  // mud flecks when Drizzle brushes himself off
  const FLECKS = [];
  for (let i = 0; i < 12; i++) {
    const e = el("ellipse", { rx: 7 + (i % 3) * 1.5, ry: 5, fill: P.slate, stroke: INK, "stroke-width": 2, opacity: 0 }, fxL);
    FLECKS.push({ e, tb: 15.0 + i * 0.12, dir: i % 2 ? 1 : -1, vx: 120 + Math.abs(H(i + 21)) * 140, vy: -90 - Math.abs(H(i + 31)) * 120, oy: -60 - (i % 4) * 22 });
  }
  const drawFlecks = (t) => {
    FLECKS.forEach((f) => {
      const v = t - f.tb;
      if (v < 0 || v > 0.6) { f.e.setAttribute("opacity", 0); return; }
      const x = DX_Q + 10 + f.dir * (20 + f.vx * v), y = hipY(DX_Q) + 40 + f.oy + f.vy * v + 700 * v * v;
      f.e.setAttribute("cx", f1(x)); f.e.setAttribute("cy", f1(y));
      f.e.setAttribute("opacity", (0.9 * (1 - v / 0.6)).toFixed(3));
    });
  };

  // ---------------------------------------------------------------- characters
  function walk(keys, t0, t1, x0, x1, step, A, B, extra) {
    const n = Math.max(1, Math.round((t1 - t0) / step));
    for (let i = 1; i <= n; i++) {
      const u = i / n, t = +(t0 + (t1 - t0) * u).toFixed(3), x = x0 + (x1 - x0) * u;
      const ab = typeof A === "function" ? A(t, i) : (i % 2 ? A : B);
      keys.push(Object.assign({ t, pose: ab, x, y: hipY(x), ease: "none" }, extra ? extra(t, i) : {}));
    }
  }
  const climbA = M("walkA", { torso: 12, head: -4 }), climbB = M("walkB", { torso: 12, head: -4 });
  const coverB = M("cover", { torso: 46, head: 30, lsh: 146, rsh: 156 });
  const braceA = M("brace", { torso: 4, lsh: -70, rsh: 72, lel: 20, rel: 20 }), braceB = M("brace", { torso: 10, lsh: -50, rsh: 58, head: 10 });
  const brushA = M("idle", { torso: 10, head: 24, rsh: 46, rel: 104, lsh: 6, lel: 20 });
  const brushB = M("idle", { torso: 12, head: 20, rsh: 18, rel: 26, lsh: 40, lel: 100 });

  const mags = RD.figure(charL, { character: "mags", x: 120, y: hipY(120), scale: SC, facing: 1 });
  const drizzle = RD.figure(charL, { character: "drizzle", x: 330, y: hipY(330), scale: SC, facing: 1, bag: true });

  // --- Mags (behind): climbs, braces, radio down, cover + shout, holds; up, radio back, "Up. Keep moving." and climbs
  const mk = [{ t: 0, pose: "walkB", x: 120, y: hipY(120), facing: 1, face: "neutral", radio: true }];
  walk(mk, 0, 6.9, 120, MX_Q, 0.4, climbA, climbB, (t) => ({ face: t < 3.6 ? "neutral" : "determined" }));
  const MY = hipY(MX_Q);
  mk.push({ t: 7.15, pose: braceA, x: MX_Q + 2, y: MY, face: "scared", ease: "power2.out" });
  mk.push({ t: 7.55, pose: braceB, x: MX_Q + 2, y: MY, face: "worried" });
  mk.push({ t: 7.95, pose: M("crouch", { lsh: 70, lel: 10 }), x: MX_Q, y: MY, face: "determined", radio: false });
  mk.push({ t: 8.4, pose: "cover", x: MX_Q, y: MY, face: "determined" });
  mk.push({ t: 8.6, pose: "cover", x: MX_Q, y: MY, talk: true });
  for (let t = 9.05, i = 0; t < 14.0; t += 0.45, i++) mk.push({ t: +t.toFixed(2), pose: i % 2 ? "cover" : coverB, x: MX_Q, y: MY, talk: t < 11.6, face: "determined", ease: "sine.inOut" });
  mk.push({ t: 14.2, pose: "cover", x: MX_Q, y: MY, talk: false, face: "neutral" });
  mk.push({ t: 14.6, pose: M("crouch", { lsh: 72, lel: 8, head: 20 }), x: MX_Q, y: MY, face: "neutral" });
  mk.push({ t: 14.9, pose: M("crouch", { lsh: 60, lel: 20, head: 10 }), x: MX_Q, y: MY, radio: true });
  mk.push({ t: 15.4, pose: "idle", x: MX_Q, y: MY, face: "neutral" });
  mk.push({ t: 15.9, pose: M("idle", { head: 8 }), x: MX_Q, y: MY });
  walk(mk, 15.9, 17.5, MX_Q, 512, 0.4, climbA, climbB, () => ({ face: "neutral" }));
  mk.push({ t: 17.75, pose: M("point", { rsh: 142, rel: 0, head: -14, torso: -4 }), x: 514, y: hipY(514), talk: true, face: "determined" });
  walk(mk, 17.9, 19.7, 514, 676, 0.3, (t, i) => (t < 18.7 ? M(i % 2 ? climbA : climbB, { rsh: 136, rel: 0 }) : (i % 2 ? climbA : climbB)), null,
    (t) => ({ talk: true, face: t < 19.3 ? "determined" : "worried" }));
  // land exactly on s11's t=0 state: Mags walkA at x 690, face worried
  mk.push({ t: 19.85, pose: "walkB", x: 683, y: hipY(683), talk: false, face: "worried", ease: "none" });
  mk.push({ t: 20, pose: "walkA", x: 690, y: hipY(690), talk: false, face: "worried", radio: true, facing: 1, ease: "none" });
  RD.animate(tl, mags, mk, { start: 0, end: D });

  // --- Drizzle (ahead): climbs chatting, wobbles, drops to cover on Mags' order, up, brushes off, climbs on
  const dk = [{ t: 0, pose: "walkA", x: 330, y: hipY(330), facing: 1, face: "smile", bag: true }];
  walk(dk, 0, 6.9, 330, DX_Q, 0.36, climbB, climbA, (t) => ({ talk: t >= 3.8 && t < 6.6, face: t < 3.8 ? "smile" : "grin" }));
  const DY = hipY(DX_Q);
  dk.push({ t: 7.15, pose: braceA, x: DX_Q + 3, y: DY, face: "scared", talk: false, ease: "power2.out" });
  dk.push({ t: 7.6, pose: M("brace", { lsh: -80, rsh: 84, torso: -4 }), x: DX_Q + 6, y: DY, face: "scared" });
  dk.push({ t: 8.1, pose: M(braceA, { torso: 14 }), x: DX_Q + 2, y: DY, face: "scared" });
  dk.push({ t: 8.65, pose: M("brace", { lsh: -60, rsh: 70, head: 4 }), x: DX_Q, y: DY, face: "o" });
  dk.push({ t: 9.0, pose: "crouch", x: DX_Q, y: DY, face: "scared" });
  dk.push({ t: 9.35, pose: "cover", x: DX_Q, y: DY, face: "scared" });
  for (let t = 9.8, i = 0; t < 14.0; t += 0.4, i++) dk.push({ t: +t.toFixed(2), pose: i % 2 ? "cover" : coverB, x: DX_Q, y: DY, face: t < 12.0 ? "scared" : "closed", ease: "sine.inOut" });
  dk.push({ t: 14.3, pose: "cover", x: DX_Q, y: DY, face: "worried" });
  dk.push({ t: 14.65, pose: "crouch", x: DX_Q, y: DY, face: "worried" });
  dk.push({ t: 14.95, pose: "idle", x: DX_Q, y: DY, face: "worried" });
  for (let t = 15.15, i = 0; t < 16.5; t += 0.24, i++) dk.push({ t: +t.toFixed(2), pose: i % 2 ? brushB : brushA, x: DX_Q, y: DY, talk: t >= 15.6, face: "worried", ease: "sine.inOut" });
  dk.push({ t: 16.8, pose: M("idle", { head: 22, torso: 6 }), x: DX_Q, y: DY, talk: true, face: "worried" });
  dk.push({ t: 17.6, pose: M("idle", { head: 6 }), x: DX_Q, y: DY, talk: false, face: "worried" });
  dk.push({ t: 18.0, pose: "idleB", x: DX_Q, y: DY, face: "determined" });
  walk(dk, 18.1, 19.7, DX_Q, 832, 0.3, climbA, climbB, (t) => ({ face: t < 19.3 ? "determined" : "smile" }));
  // land exactly on s11's t=0 state: Drizzle walkB at x 850, face smile, bag on
  dk.push({ t: 20, pose: "walkB", x: 850, y: hipY(850), face: "smile", talk: false, bag: true, facing: 1, ease: "none" });
  RD.animate(tl, drizzle, dk, { start: 0, end: D });
  charL.appendChild(drizzle.g);

  // ---------------------------------------------------------------- environment proxy (sway, rocks, needles, flecks, radio prop)
  const env = { t: 0 };
  const drawEnv = (t) => {
    drawSway(t); drawRocks(t); drawNeedles(t); drawFlecks(t);
    radioG.setAttribute("opacity", t >= 7.95 && t < 14.9 ? 1 : 0);
  };
  drawEnv(0);
  tl.fromTo(env, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => drawEnv(env.t) }, 0);

  // ---------------------------------------------------------------- weather + the aftershock
  RD.rain(tl, fxL, { start: 0, end: D, count: 140, opacity: 0.45, seed: 23 });
  RD.shake(tl, "#" + SID + "-shake", { start: QS, end: QE, amp: 10, rot: 0.45, freq: 10, rampIn: 0.3, rampOut: 1.4 });

  // ---------------------------------------------------------------- camera: follow the climb, punch in on the quake, settle on s11's framing
  const cam = "#" + SID + "-cam";
  tl.fromTo(cam, { scale: 1.12, x: 115, y: -62, svgOrigin: "960 540" }, { scale: 1.15, x: 140, y: -80, svgOrigin: "960 540", duration: QS, ease: "sine.inOut" }, 0);
  tl.fromTo(cam, { scale: 1.15, x: 140, y: -80, svgOrigin: "960 540" }, { scale: 1.2, x: 188, y: -104, svgOrigin: "960 540", duration: 1.4, ease: "power2.out", immediateRender: false }, QS);
  tl.fromTo(cam, { scale: 1.2, x: 188, y: -104, svgOrigin: "960 540" }, { scale: 1.21, x: 190, y: -106, svgOrigin: "960 540", duration: 14.2 - QS - 1.4, ease: "none", immediateRender: false }, QS + 1.4);
  tl.fromTo(cam, { scale: 1.21, x: 190, y: -106, svgOrigin: "960 540" }, { scale: 1.06, x: 10, y: -10, svgOrigin: "960 540", duration: D - 14.2, ease: "power1.inOut", immediateRender: false }, 14.2);

  window.__timelines["ep01-s10"] = tl;
})();

  </script>
