  // ---- rising steam / smoke puffs: draw(t, strength 0..1). Puffs are born on a fixed schedule and drift up.
  function steam(layer, x, y, o) {
    o = o || {};
    const n = o.n || 7, life = o.life || 2.4, rise = o.rise || 190, drift = o.drift || 40, r0 = o.r || 9;
    const g = el("g", {}, layer);
    const puffs = [];
    for (let i = 0; i < n; i++) puffs.push(el("path", { fill: o.fill || P.paper, stroke: o.stroke || P.mist, "stroke-width": 2, "stroke-linejoin": "round" }, g));
    return function (t, k) {
      puffs.forEach((p, i) => {
        const ph = (t / life + i / n) % 1, born = t - ph * life;
        const kk = o.strengthAt ? o.strengthAt(born) : k;
        if (kk <= 0.02) { p.setAttribute("opacity", 0); return; }
        const cx = x + H(i * 13 + Math.floor(t / life + i / n) * 3) * 10 * kk + Math.sin(ph * 4 + i) * 10 + drift * ph;
        const cy = y - ph * rise * (0.6 + 0.4 * kk);
        const r = r0 * (0.6 + 1.8 * ph) * (0.5 + 0.7 * kk);
        // a lumpy hand-drawn puff (4 bumps)
        const b = [0, 1, 2, 3, 4, 5].map((j) => { const a = (j / 6) * Math.PI * 2 + i; const rr = r * (0.85 + 0.25 * H(i * 5 + j)); return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.8]; });
        let d = `M${f1(b[0][0])} ${f1(b[0][1])}`;
        for (let j = 1; j <= 6; j++) { const pA = b[j - 1], pB = b[j % 6], mx = (pA[0] + pB[0]) / 2, my = (pA[1] + pB[1]) / 2; const ox = (mx - cx) * 0.45, oy = (my - cy) * 0.45; d += ` Q${f1(mx + ox)} ${f1(my + oy)} ${f1(pB[0])} ${f1(pB[1])}`; }
        p.setAttribute("d", d + " Z");
        const fade = ph < 0.15 ? ph / 0.15 : 1 - (ph - 0.15) / 0.85;
        p.setAttribute("opacity", f1(fade * (o.opacity || 0.85) * Math.min(1, kk * 1.3)));
      });
    };
  }

  // camera: keys [[t, cx, cy, s], ...] (centre + scale, clamped to the set), sine.inOut between keys; one proxy tween
  // writes the cam group's transform (exact, no origin drift).
  function camera(keys) {
    const camEl = q("cam");
    const at = (t) => {
      let i = 0;
      while (i < keys.length - 1 && t >= keys[i + 1][0]) i++;
      const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
      const u = b[0] > a[0] ? clamp((t - a[0]) / (b[0] - a[0]), 0, 1) : 0, e = 0.5 - 0.5 * Math.cos(Math.PI * u);
      const s = lerp(a[3], b[3], e);
      const hw = 960 / s, hh = 540 / s;
      const cx = clamp(lerp(a[1], b[1], e), hw, 1920 - hw), cy = clamp(lerp(a[2], b[2], e), hh, 1080 - hh);
      camEl.setAttribute("transform", `matrix(${s.toFixed(5)} 0 0 ${s.toFixed(5)} ${(960 - cx * s).toFixed(2)} ${(540 - cy * s).toFixed(2)})`);
    };
    every(at);
  }

    const ex = Object.assign({}, extra || {}); delete ex.poseA; delete ex.poseB;
    for (let i = 1; i <= n; i++) out.push(Object.assign({ t: +(t0 + i * dt).toFixed(3), pose: i % 2 ? pA : pB, x: x0 + ((x1 - x0) * i) / n, facing: dir }, i === 1 ? ex : {}));

  RD.animate(tl, nb, [
    { t: 0, pose: scoop, face: "neutral" },

  // DRIZZLE: snugs the tarp corner, ties it down, slides the bucket under the drip, asks about the tap

    { t: 7.6, pose: M("crouch", { torso: 10, head: -14, lsh: 30, rsh: 40 }), face: "grin" }, // plink!

  const MX = 1080, FX0 = 1540;
  RD.animate(tl, mags, [

    { t: 6.4, pose: countA },                                                               // "Sewage,

    { t: 10.0, pose: "walkA", facing: 1, x: 1150 }, { t: 10.35, pose: "walkB", x: 1215 }, { t: 10.7, pose: "walkA", x: 1290 },
    { t: 11.05, pose: "walkB", x: 1365 }, { t: 11.4, pose: "walkA", x: 1440 }, { t: 11.75, pose: "walkB", x: 1510, talk: true },
    { t: 12.05, pose: M("crouch", { torso: 34, head: 16, lsh: -22, lel: 10, rsh: -16, rel: 10 }), x: FX0 - 4 },   // "Pipes broke." picks up the pot
    { t: 12.45, pose: carryPot, x: FX0 },

    { t: 14.3, pose: M("point", { head: 4, rsh: 88 }) },

  // ---- per-frame props (after the figures so their joints are current)
  const POT_GROUND = { x: 1606, y: 846 }, PICK = 12.15, SET0 = 12.55, SET1 = 13.05;
  const BOIL0 = 13.4, ROLL = 15.4;
  every((t) => {
    // rope: hand-held to the corner while tugging, tied down to a stake after 4.1 s
    const corner = [575, 452];
    if (t < 1.6) rope.setAttribute("d", "");
    else if (t < 3.9) { const h = drizzle.hand("r"); rope.setAttribute("d", `M${corner[0]} ${corner[1]} L${f1(h[0])} ${f1(h[1])}`); }
    else rope.setAttribute("d", `M${corner[0]} ${corner[1]} L527 840`);
    stake.setAttribute("opacity", t >= 3.7 ? 1 : 0);
    const lift = t < 7.6;
    if (lift && bucketG.parentNode !== bucketHold) bucketHold.appendChild(bucketG);
    if (!lift && bucketG.parentNode !== bucketHome) bucketHome.insertBefore(bucketG, bucketNext);
    rc(t);
    // pot: on the ground → in Mags' hands → onto the grate
    if (potOk) {
      let px = POT_GROUND.x, py = POT_GROUND.y;
      if (t >= PICK) {
        const hl = mags.hand("l"), hr = mags.hand("r");
        const hx = (hl[0] + hr[0]) / 2 + 6, hy = (hl[1] + hr[1]) / 2 + 28;
        const u = seg(t, PICK, PICK + 0.2);
        px = lerp(POT_GROUND.x, hx, u); py = lerp(POT_GROUND.y, hy, u);
        const v = seg(t, SET0, SET1);
        px = lerp(px, POT.x, v); py = lerp(py, POT.y, v);
      }
      const carried = t >= PICK && t < SET1;
      if (carried && potG.parentNode !== potLift) potLift.appendChild(potG);
      if (!carried && potG.parentNode !== fireG) fireG.insertBefore(potG, fireL);
      // rolling boil makes the pot chatter a little on the grate
      const boil = clamp((t - BOIL0) / (ROLL - BOIL0), 0, 1), roll = t >= ROLL ? 1 : 0;
      const jx = roll ? H(Math.floor(t * 14)) * 1.2 : 0;
      potG.setAttribute("transform", `translate(${f1(px - POT.x + jx)} ${f1(py - POT.y)})`);
      // water surface + bubbles
      const fr = Math.floor(t * 12);
      potWater.setAttribute("ry", f1(4.5 + roll * 1.2 * (H(fr) + 1)));
      potWater.setAttribute("cy", f1(POT.y + 2 - roll * 1.5));
      const nb2 = t < BOIL0 ? 0 : t < ROLL ? Math.round(1 + 3 * boil) : 9;
      bubbles.forEach((b, i) => {
        if (i >= nb2) { b.setAttribute("d", ""); return; }
        const per = t >= ROLL ? 0.32 + 0.12 * ((i * 7) % 3) : 0.6;
        const ph = ((t + i * 0.137) / per) % 1, cyc = Math.floor((t + i * 0.137) / per);
        const bx = POT.x + H(i * 31 + cyc * 7) * 22, by = POT.y + 2 + H(i * 17 + cyc * 3) * 2.5;
        const r = (t >= ROLL ? 6.5 + 5 * ((H(i + cyc) + 1) / 2) : 3.6) * Math.sin(ph * Math.PI);
        const up = t >= ROLL ? r * 0.9 : r * 0.6;
        b.setAttribute("d", r < 0.6 ? "" : `M${f1(bx - r)} ${f1(by)} Q${f1(bx - r)} ${f1(by - up * 1.4)} ${f1(bx)} ${f1(by - up * 1.4)} Q${f1(bx + r)} ${f1(by - up * 1.4)} ${f1(bx + r)} ${f1(by)} Z`);
      });
      // steam: wisps once it heats, big rolling plume at the boil
      potSteam(t, t < BOIL0 ? 0 : t < ROLL ? 0.15 + 0.35 * boil : 1);
    }
    // the fire: small flames all along, a little stronger once the pot is on
    fire(t, 0.85 + 0.2 * seg(t, 12.6, 13.6) + 0.05 * Math.sin(t * 3));
    smoke(t, 0.6);

    pudRings.forEach((r, i) => {
      const per = 0.7, ph = ((t + i * 0.35) / per) % 1, c = Math.floor((t + i * 0.35) / per);

      r.setAttribute("rx", f1(3 + 14 * ph)); r.setAttribute("ry", f1(1 + 3.5 * ph)); r.setAttribute("opacity", f1(1 - ph));
    });
  });

})();
