  const VALVE_TURN = RD.mix("crouch", { torso: 30, head: 24, lsh: -6, lel: 6, rsh: -4, rel: 44 });
  const WATCH = RD.mix("crouch", { torso: 24, head: 20, lsh: -4, lel: 20, rsh: 4, rel: 30 });
  const LOOKBACK = RD.mix("crouch", { torso: 10, head: -8, lsh: -10, lel: 20, rsh: 6, rel: 24 });
  const MAG_POINT_LOW = RD.mix("point", { rsh: 72, head: 6 });

  // Drizzle ground/scale at the water heater (set back in depth)
  const WG = 806, WS = 1.18, WX = 1636;
  const MG = 846, MS = 1.32, MX = 1500;

  const dKeys = [
    { t: 0, pose: SIT, x: 800, y: Y0, scale: S, facing: -1, face: "smile" },
    { t: 0.45, pose: OFFER, face: "smile" },
    { t: 0.6, talk: true },
    { t: 1.05, pose: OFFER },
    { t: 1.4, pose: SHH, ease: "back.out(1.6)" },
    { t: 2.5, pose: SHH },
    { t: 2.8, pose: SIT, talk: false, face: "smile" },
    { t: 3.3, pose: SIT, face: "neutral" },
    { t: 3.9, pose: "idle", x: 820, facing: 1, face: "neutral", ease: "power2.out" },
  ];
  dKeys.push(...walk(3.9, 5.2, 820, 1160));
  dKeys.push({ t: 5.45, pose: RD.mix("reach", { lsh: 60, lel: 10, rsh: 20 }), x: 1180 });
  dKeys.push({ t: 5.7, pose: CARRY_L, x: 1190 });
  dKeys.push(...walk(5.7, 7.0, 1190, WX - 30, { g0: GY, g1: WG, s0: S, s1: WS }));
  dKeys.push({ t: 7.2, pose: CARRY_L, x: WX - 30, face: "o" });
  dKeys.push({ t: 7.4, pose: WOW, talk: true });
  dKeys.push({ t: 8.3, pose: RD.mix("talk", { lsh: 4, lel: 4, rsh: 140, rel: 30, head: -6 }) });
  dKeys.push({ t: 9.4, pose: WOW, talk: false, face: "grin" });
  dKeys.push({ t: 9.9, pose: VALVE, x: WX, face: "determined" });
  dKeys.push({ t: 10.6, pose: VALVE });
  dKeys.push({ t: 11.0, pose: VALVE_TURN, ease: "power1.inOut" });
  dKeys.push({ t: 11.3, pose: VALVE, face: "determined" });  /* v3: intake closed */
  dKeys.push({ t: 13.6, pose: VALVE, face: "determined" });
  dKeys.push({ t: 14.0, pose: VALVE_TURN, ease: "power1.inOut" });  /* v3: drain opened */
  dKeys.push({ t: 14.3, pose: VALVE, face: "o" });
  dKeys.push({ t: 14.9, pose: WATCH, face: "grin" });
  dKeys.push({ t: 15.6, pose: WATCH, face: "grin" });
  dKeys.push({ t: 16.35, pose: LOOKBACK, facing: -1, face: "worried", ease: "power3.out" });
  dKeys.push({ t: 18.0, pose: RD.mix(LOOKBACK, { head: -4 }), face: "worried" });
  dKeys.push({ t: 19.99, pose: LOOKBACK, face: "worried" });

  const BUCKET_HOME = [1222, 860], BUCKET_VALVE = [1776, 832];
  const PICK = 5.45, SETDOWN = 9.75;
  RD.animate(tl, drizzle, dKeys, {
    start: 0, end: DUR,
    onDraw: (fig, t) => {
      // granola bar: from his pocket at 0.3 s into his hand, handed to Milo at 1.05 s
      if (t < 1.05) {
        const h = fig.hand("r");
        bar.setAttribute("opacity", t < 0.3 ? 0 : 1);
        bar.setAttribute("transform", `translate(${f1(h[0] - 6)} ${f1(h[1] - 2)}) rotate(-12)`);
      }
      // bucket: waits by the crate, hangs from his left hand, set under the valve
      let bx, by, sh = 1;
      if (t < PICK) { bx = BUCKET_HOME[0]; by = BUCKET_HOME[1]; }
      else if (t < SETDOWN) {
        const h = fig.hand("l");
        bx = h[0]; by = h[1] + (BKH + 14) * 0.95; sh = 0;
        // ease the hand-off into the hand over the first 0.2 s
        const u = clamp01((t - PICK) / 0.2);
        bx = lerp(BUCKET_HOME[0], bx, u); by = lerp(BUCKET_HOME[1], by, u);
        if (t > SETDOWN - 0.3) { const v = clamp01((t - (SETDOWN - 0.3)) / 0.3); bx = lerp(bx, BUCKET_VALVE[0], v); by = lerp(by, BUCKET_VALVE[1], v); sh = v; }
      } else { bx = BUCKET_VALVE[0]; by = BUCKET_VALVE[1]; }
      const bs = t < SETDOWN - 0.3 ? 1 : lerp(1, 1.2, clamp01((t - (SETDOWN - 0.3)) / 0.3));
      bucket.setAttribute("transform", `translate(${f1(bx)} ${f1(by)}) scale(${bs.toFixed(3)})`);
      bucketShadow.setAttribute("opacity", (0.22 * sh).toFixed(2));
    },
  });

  // Milo: wanders up from the left, takes the bar, nods, slips away left
  const miloKeys = [{ t: 0, pose: "walkA", x: 540, y: Y0, scale: S, facing: 1, face: "neutral" }];
  miloKeys.push(...walk(0, 0.75, 540, 640, { step: 0.25 }));
  miloKeys.push({ t: 0.9, pose: "idle", x: 646, face: "o" });
  miloKeys.push({ t: 1.05, pose: KID_REACH, face: "o" });
  miloKeys.push({ t: 1.45, pose: HOLD_BAR, face: "o" });
  miloKeys.push({ t: 2.0, pose: HOLD_BAR, face: "smile" });
  miloKeys.push({ t: 2.3, pose: RD.mix(HOLD_BAR, { head: 22 }) });   // nod
  miloKeys.push({ t: 2.55, pose: HOLD_BAR });
  miloKeys.push({ t: 2.8, pose: RD.mix(HOLD_BAR, { head: 18 }) });
  miloKeys.push({ t: 3.1, pose: HOLD_BAR, facing: -1, face: "smile" });
  miloKeys.push(...walk(3.1, 5.4, 646, 330, { step: 0.24 }).map((k) => Object.assign(k, { pose: RD.mix(k.pose, { rsh: 40, rel: 110 }) })));
  miloKeys.push({ t: 5.6, pose: HOLD_BAR, x: 330 });
  miloKeys.push({ t: 19.99, pose: HOLD_BAR, x: 330 });
  RD.animate(tl, milo, miloKeys, {
    start: 0, end: DUR,
    onDraw: (fig, t) => {
      if (t >= 1.05) {
        const h = fig.hand("r");
        bar.setAttribute("opacity", 1);
        bar.setAttribute("transform", `translate(${f1(h[0] + 4 * fig.state.facing)} ${f1(h[1] - 3)}) rotate(${fig.state.facing > 0 ? -8 : 8}) scale(0.9)`);
      }
    },
  });

  // Mags: on the crate watching (from s12), then leads Drizzle to the utility shed and shows him the water heater
  const mKeys = [
    { t: 0, pose: CRATE_SIT, x: 1124, y: Y0, scale: S, facing: -1, face: "neutral" },
    { t: 1.6, pose: RD.mix(CRATE_SIT, { head: 10 }), face: "smile" },
    { t: 2.6, pose: CRATE_SIT, face: "smile" },
    { t: 3.2, pose: "idle", x: 1150, facing: 1, talk: true, ease: "power2.out" },
    { t: 3.5, pose: RD.mix("talk", { head: 0 }) },
  ];
  mKeys.push(...walk(3.6, 6.0, 1150, MX, { g0: GY, g1: MG, s0: S, s1: MS }));
  mKeys.push({ t: 6.2, pose: "point", x: MX, ease: "power2.out" });
  mKeys.push({ t: 6.4, talk: false, face: "smile" });
  mKeys.push({ t: 7.2, pose: "idle", face: "smile" });
  mKeys.push({ t: 9.4, pose: "idleB", face: "neutral" });
  mKeys.push({ t: 9.8, pose: "talk", talk: true });
  mKeys.push({ t: 10.5, pose: MAG_POINT_LOW });
  mKeys.push({ t: 11.4, pose: RD.mix("talk", { rsh: 50, rel: 50 }) });
  mKeys.push({ t: 12.2, pose: "idle", talk: false, face: "smile" });
  mKeys.push({ t: 15.7, pose: "idle", face: "smile" });
  mKeys.push({ t: 16.3, pose: RD.mix("idle", { head: -6 }), facing: -1, face: "worried", ease: "power3.out" });
  mKeys.push({ t: 17.6, pose: RD.mix("idle", { head: -4, torso: -2 }), face: "determined" });
  mKeys.push({ t: 19.99, pose: RD.mix("idle", { head: -4, torso: -2 }), face: "determined" });
  RD.animate(tl, mags, mKeys, { start: 0, end: DUR });

  // Gord: walks out in the far camp, climbs his crate, arm up, shouting
  const gy0 = yFor(GG, GS), gyUp = yFor(GG - CRH, GS);
  const gKeys = [{ t: 0, pose: "idle", x: 1290, y: gy0, scale: GS, facing: -1, face: "determined" }];
  gKeys.push({ t: 14.4, pose: "idle", x: 1290 });
  gKeys.push(...walk(14.4, 15.4, 1290, GX + 20, { step: 0.2 }));
  gKeys.push({ t: 15.7, pose: RD.mix("walkA", { dy: -6 }), x: GX + 6, y: gy0 - 10 });
  gKeys.push({ t: 15.95, pose: "idle", x: GX, y: gyUp, facing: 1 });
  gKeys.push({ t: 16.1, pose: UP1, talk: true, ease: "back.out(2)" });
  gKeys.push({ t: 16.9, pose: UP2 });
  gKeys.push({ t: 17.6, pose: "point" });
  gKeys.push({ t: 18.5, pose: UP1 });
  gKeys.push({ t: 19.2, pose: UP2 });
  gKeys.push({ t: 19.6, pose: UP1, talk: false, face: "determined" });
  gKeys.push({ t: 19.99, pose: UP1 });
  RD.animate(tl, gord, gKeys, { start: 0, end: DUR });

  // ---------------------------------------------------------------- water: stream from the drain valve, bucket filling
  const WHt = bg.waterHeater;
  const SX = WHt.valveX + 4, SY = WHt.valveY + 6;   // spout outlet
  const STREAM_ON = 14.35;  /* v3: after the hot tap + drain line */
  const water = { t: 0 };
  const drawWater = (t) => {
    // bucket water level 0..0.85 from STREAM_ON to the end
    const lev = t < STREAM_ON ? 0 : clamp01((t - STREAM_ON) / (DUR - STREAM_ON)) * 0.85 + 0.08;
    const on = t < STREAM_ON ? 0 : clamp01((t - STREAM_ON) / 0.25);
    streamG.setAttribute("opacity", on.toFixed(2));
    const rimY = BUCKET_VALVE[1] - BKH * 1.2;
    const endY = rimY + 6 + (1 - lev) * 12;
    const wob = Math.sin(t * 23) * 1.2;
    const d = `M${SX} ${SY} Q ${f1(SX + 7 + wob)} ${f1(SY + 6)} ${f1(SX + 6 + wob * 0.5)} ${f1(endY)}`;
    streamOut.setAttribute("d", d); streamIn.setAttribute("d", d); streamHi.setAttribute("d", d);
    streamHi.setAttribute("stroke-dashoffset", f1(-t * 90));
    splash.forEach((c, i) => {
      const ph = (t * 3.1 + i * 0.37) % 1;
      const dir = i % 2 ? 1 : -1;
      c.setAttribute("cx", f1(SX + 6 + dir * (4 + ph * (8 + i * 2))));
      c.setAttribute("cy", f1(endY - 6 * Math.sin(ph * Math.PI) - 1));
      c.setAttribute("opacity", (on * (1 - ph) * 0.9).toFixed(2));
    });
    // water surface inside the bucket (bucket-local coords)
    waterSurf.setAttribute("opacity", lev > 0 ? 0.95 : 0);
    waterSurf.setAttribute("rx", f1(4 + 16 * lev)); waterSurf.setAttribute("ry", f1(1.5 + 4 * lev));
    waterSurf.setAttribute("cy", f1(-BKH + 3 - lev));
    [ring1, ring2].forEach((r, i) => {
      const ph = (t * 1.7 + i * 0.5) % 1;
      r.setAttribute("rx", f1(3 + ph * 15 * Math.max(0.4, lev)));
      r.setAttribute("ry", f1(1 + ph * 4 * Math.max(0.4, lev)));
      r.setAttribute("cx", 4);
      r.setAttribute("cy", f1(-BKH + 3 - lev));
      r.setAttribute("opacity", (on * (1 - ph) * 0.8).toFixed(2));
    });
    // tarp drip into the rain bucket, every 0.8 s
    const dp = (t % 0.8) / 0.8;
    if (dp < 0.55) {
      const u = dp / 0.55;
      drip.setAttribute("cy", f1(RC.dripTopY + (RC.bucketY - RC.dripTopY) * u * u));
      drip.setAttribute("opacity", u > 0.98 ? 0 : 1);
      dripRing.setAttribute("opacity", 0);
    } else {
      drip.setAttribute("cy", f1(RC.dripTopY)); drip.setAttribute("opacity", ((dp - 0.55) / 0.45 * 0.8).toFixed(2));
      const u = (dp - 0.55) / 0.45;
      dripRing.setAttribute("rx", f1(4 + u * 18)); dripRing.setAttribute("ry", f1(1.5 + u * 4));
      dripRing.setAttribute("opacity", ((1 - u) * 0.8).toFixed(2));
    }
  };
  drawWater(0);
  tl.fromTo(water, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => drawWater(water.t) }, 0);

  // ---------------------------------------------------------------- weather + camera
  RD.rain(tl, fx, { start: 0, end: DUR, count: 150, opacity: 0.42, seed: 13, speed: 1400 });
  tl.fromTo("#s13-cam", camAt(800, 664, 1.32), Object.assign(camAt(816, 664, 1.36), { duration: 3.3, ease: "sine.inOut" }), 0);
  tl.fromTo("#s13-cam", camAt(816, 664, 1.36), Object.assign(camAt(1272, 680, 1.5), { duration: 3.6, ease: "sine.inOut", immediateRender: false }), 3.3);
  tl.fromTo("#s13-cam", camAt(1272, 680, 1.5), Object.assign(camAt(1300, 696, 1.58), { duration: 8.6, ease: "sine.inOut", immediateRender: false }), 6.9);
  tl.fromTo("#s13-cam", camAt(1300, 696, 1.58), Object.assign(camAt(1180, 650, 1.3), { duration: 0.9, ease: "power2.inOut", immediateRender: false }), 15.5);
  tl.fromTo("#s13-cam", camAt(1180, 650, 1.3), Object.assign(camAt(1176, 646, 1.33), { duration: DUR - 16.4, ease: "sine.inOut", immediateRender: false }), 16.4);

  window.__timelines[COMP] = tl;
})();
  </script>
</template>
