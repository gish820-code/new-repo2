  const NS = "http://www.w3.org/2000/svg";

  const POSES = {

(function () {

    const gq = [lx(0.16, 0.04), lx(0.84, 0.05), lx(0.84, 0.86), lx(0.16, 0.9)];

  // ---------------------------------------------------------------- characters
  const chars = $("chars");

  const v2 = RD.figure(chars, { character: "extra", x: 1830, y: HIP, scale: SC, facing: -1, face: "worried", coat: "slate", hat: "beanie", hatColor: "steel", hair: "long", hairColor: "night", seed: 67, speaker: "volunteer", pose: "walkA" });
  const pruitt = RD.figure(chars, { character: "extra", x: 1680, y: HIP, scale: SC, facing: -1, face: "worried", coat: "mist", hat: "cap", hatColor: "slate", hair: "short", hairColor: "storm", seed: 61, speaker: "pruitt", pose: "walkB" });
  const v1 = RD.figure(chars, { character: "extra", x: 1530, y: HIP, scale: SC, facing: -1, face: "determined", coat: "steel", hat: "hood", hatColor: "storm", seed: 63, speaker: "volunteer", pose: "walkA" });

  const wadeA = M("walkA", { lhip: -30, lkn: 30, rhip: 34, rkn: 40, lsh: 30, lel: 30, rsh: -20, torso: 7 });
  const wadeB = M("walkB", { lhip: 34, lkn: 40, rhip: -30, rkn: 30, lsh: -20, rsh: 30, rel: 30, torso: 7 });
  function wade(keys, t0, t1, x0, x1, y0, y1, extra) {

  const RIPS = [];
  function ripplesFor(fig, seed) {
    const r = [0, 1, 2, 3].map((i) => el("ellipse", { fill: "none", stroke: P.fog, "stroke-width": 2.2 }, ripG));
    RIPS.push({ fig, r, seed });
    return (f, t) => {
      const j = f.joints;
      [j.lfoot, j.rfoot].forEach((ft, k) => {
        [0, 1].forEach((m) => {
          const e = r[k * 2 + m], u = ((t * 0.7 + seed * 0.13 + k * 0.5 + m * 0.5) % 1 + 1) % 1;
          e.setAttribute("cx", f1(ft[0])); e.setAttribute("cy", f1(FEET + 4));
          e.setAttribute("rx", f1(14 + 46 * u)); e.setAttribute("ry", f1(4 + 9 * u));
          e.setAttribute("opacity", ((1 - u) * 0.55).toFixed(3));
        });
      });
    };
  }

  // --- GORD: leads the wade in, stops, turns back to Pruitt ("Just grab the water. Fast."), points at the store,
  //     wades to the door, tucks the clipboard, wrenches the door open in jerks ("Pallet's right inside...")
  const GX = 738;
  const pull = M("reach", { torso: 6, head: 2, lsh: 92, lel: 6, rsh: 86, rel: 8, lhip: -14, lkn: 10, rhip: 18, rkn: 14 });
  const yank = M(pull, { torso: -14, head: -6, lsh: 80, lel: 4, rsh: 76, rel: 6, lhip: -24, lkn: 24, rhip: 26, rkn: 6 });
  const gk = [{ t: 0, pose: wadeB, x: 1380, y: HIP, facing: -1, face: "determined" }];
  wade(gk, 0, 4.4, 1380, 900, HIP, HIP);
  gk.push({ t: 4.9, pose: "idle", x: 892, y: HIP });
  gk.push({ t: 5.6, pose: M("idle", { head: 4 }), x: 892, y: HIP, facing: 1, face: "neutral" });   // turns back to Pruitt
  gk.push({ t: 6.2, pose: "talk", x: 892, y: HIP, face: "determined", talk: true });
  gk.push({ t: 7.1, pose: M("talk", { lsh: 30, rsh: 50, rel: 40 }), x: 892, y: HIP });
  gk.push({ t: 7.6, pose: M("point", { rsh: 80, head: 0 }), x: 892, y: HIP, facing: -1 });         // jabs at the store
  gk.push({ t: 8.4, pose: M("point", { rsh: 88 }), x: 892, y: HIP, talk: false });
  wade(gk, 8.6, 10.2, 892, GX, HIP, HIP);
  gk.push({ t: 10.6, pose: M("idle", { lsh: 40, lel: 110 }), x: GX, y: HIP, clipboard: true });     // tucks the clipboard
  gk.push({ t: 10.9, pose: M("idle", { lsh: 30, lel: 100 }), x: GX, y: HIP, clipboard: false });
  gk.push({ t: 11.4, pose: pull, x: GX, y: HIP });
  gk.push({ t: 11.6, pose: pull, x: GX, y: HIP, talk: true });
  JERKS.forEach(([t, e], i) => {
    gk.push({ t: t - 0.25, pose: M(pull, { torso: 10 }), x: GX - 6 + (e - 554) * 0.2, y: HIP, talk: t - 0.25 >= 14.59 ? false : undefined });
    gk.push({ t: t + 0.12, pose: yank, x: GX + 10 + (e - 554) * 0.55, y: HIP, ease: "power3.out" });
  });
  const GEND = GX + 10 + 80 * 0.55;   // 803
  gk.push({ t: 15.3, pose: M("reach", { torso: 2, lsh: 70, lel: 10, rsh: 64, rel: 30 }), x: GEND, y: HIP, face: "determined" });  // holds it open
  gk.push({ t: 16.4, pose: M("reach", { torso: 4, head: 8, lsh: 66, lel: 12, rsh: 40, rel: 70 }), x: GEND, y: HIP });              // waves V1 in
  gk.push({ t: 17.4, pose: M("reach", { torso: 2, head: 2, lsh: 68, lel: 10, rsh: 20, rel: 30 }), x: GEND, y: HIP });
  gk.push({ t: 19.0, pose: M("reach", { torso: 3, head: 4, lsh: 68, lel: 10, rsh: 18, rel: 26 }), x: GEND, y: HIP });
  const gRip = ripplesFor(gord, 1);
  RD.animate(tl, gord, gk.filter((k, i, a) => !(i > 0 && k.t <= a[i - 1].t)), { start: 0, end: DUR, onDraw: gRip });

  // --- V1: wades in, waits, follows Gord to the door and pulls with him; slips into the doorway at the end
  const V1X = 646;
  const v1k = [{ t: 0, pose: wadeA, x: 1530, y: HIP, facing: -1, face: "determined" }];
  wade(v1k, 0, 4.8, 1530, 1050, HIP, HIP);
  v1k.push({ t: 5.3, pose: "idle", x: 1050, y: HIP, face: "worried" });
  v1k.push({ t: 6.6, pose: M("idle", { head: 6 }), x: 1050, y: HIP, facing: 1 });
  v1k.push({ t: 8.4, pose: M("idle", { head: 2 }), x: 1050, y: HIP, facing: -1, face: "determined" });
  wade(v1k, 8.6, 11.0, 1050, V1X + 20, HIP, HIP);
  v1k.push({ t: 11.5, pose: M(pull, { lsh: 70, rsh: 108, torso: 12 }), x: V1X, y: HIP });
  JERKS.forEach(([t, e]) => {
    v1k.push({ t: t - 0.25, pose: M(pull, { lsh: 70, rsh: 108, torso: 14 }), x: V1X - 4 + (e - 554) * 0.3, y: HIP });
    v1k.push({ t: t + 0.12, pose: M(yank, { lsh: 64, rsh: 100 }), x: V1X + 8 + (e - 554) * 0.42, y: HIP, ease: "power3.out" });
  });
  const V1E = V1X + 8 + 80 * 0.42;
  v1k.push({ t: 15.5, pose: "idle", x: V1E, y: HIP, face: "neutral" });
  wade(v1k, 16.2, 17.4, V1E, 640, HIP, HIP - 4);                        // steps up to the open doorway
  v1k.push({ t: 18.0, pose: M("reach", { torso: 30, head: 14, lsh: 40, lel: 30, rsh: 70, rel: 20 }), x: 632, y: HIP - 4, face: "worried" });   // leans into the dark
  v1k.push({ t: 19.9, pose: M("reach", { torso: 34, head: 18, lsh: 44, lel: 30, rsh: 76, rel: 20 }), x: 626, y: HIP - 4 });
  const v1Rip = ripplesFor(v1, 2);
  RD.animate(tl, v1, v1k.filter((k, i, a) => !(i > 0 && k.t <= a[i - 1].t)), { start: 0, end: DUR, onDraw: v1Rip });

  // --- PRUITT: wades in, stops and sniffs ("Gord... you smell that?"), then lunges to stop V2 from the wire
  const PX = 1420;
  const sniff = M("think", { head: -12, torso: -4, rsh: 48, rel: 128 });
  const sniffB = M(sniff, { head: -18 });
  const armBar = M("point", { rsh: 92, rel: 4, lsh: 14, lel: 30, torso: 8, head: 2 });   // arm straight out across V2's chest
  const pk = [{ t: 0, pose: wadeB, x: 1680, y: HIP, facing: -1, face: "worried" }];
  wade(pk, 0, 3.4, 1680, PX, HIP, HIP);
  pk.push({ t: 3.6, pose: M("idle", { head: -8 }), x: PX, y: HIP, face: "worried" });
  pk.push({ t: 3.9, pose: sniff, x: PX, y: HIP, talk: true });
  pk.push({ t: 4.7, pose: sniffB, x: PX, y: HIP });
  pk.push({ t: 5.5, pose: sniff, x: PX, y: HIP });
  pk.push({ t: 5.8, pose: M("idle", { head: -4 }), x: PX, y: HIP, talk: false, face: "worried" });
  pk.push({ t: 7.0, pose: M(sniff, { head: -8 }), x: PX, y: HIP });
  pk.push({ t: 8.3, pose: M("idle", { head: 2 }), x: PX, y: HIP, face: "scared" });
  pk.push({ t: 8.65, pose: "runA", x: PX - 70, y: HIP + 4 });
  pk.push({ t: 9.0, pose: "runB", x: PX - 150, y: HIP + 8, talk: true });
  pk.push({ t: 9.35, pose: armBar, x: PX - 212, y: HIP + 10, ease: "power3.out" });
  pk.push({ t: 10.2, pose: M(armBar, { rsh: 100, torso: 4 }), x: PX - 212, y: HIP + 10 });
  pk.push({ t: 10.6, pose: M("point", { rsh: 120, rel: 0, torso: 10, head: 10 }), x: PX - 212, y: HIP + 10 });  // points down at the wire/puddle
  pk.push({ t: 11.2, pose: M("point", { rsh: 116, torso: 8, head: 8 }), x: PX - 212, y: HIP + 10, talk: false, face: "scared" });
  pk.push({ t: 12.2, pose: M("idle", { head: 6, torso: 2 }), x: PX - 204, y: HIP + 8, face: "worried" });
  pk.push({ t: 13.6, pose: M(sniff, { head: -6 }), x: PX - 204, y: HIP + 8, face: "worried" });
  pk.push({ t: 15.0, pose: M("idle", { head: 10, torso: 4 }), x: PX - 204, y: HIP + 8 });
  pk.push({ t: 15.6, pose: M("idle", { head: 16, torso: 8 }), x: PX - 204, y: HIP + 8, face: "o" });           // hears the crackle
  pk.push({ t: 16.4, pose: M("idle", { head: 10, torso: -6, lsh: -20, lel: 50, rsh: 24, rel: 60 }), x: PX - 196, y: HIP + 8, face: "scared" });
  pk.push({ t: 17.6, pose: M("idle", { head: 12, torso: -8, lsh: -24, lel: 56, rsh: 28, rel: 70 }), x: PX - 190, y: HIP + 8, face: "scared" });
  pk.push({ t: 19.6, pose: M("idle", { head: 12, torso: -7, lsh: -22, lel: 54, rsh: 26, rel: 66 }), x: PX - 188, y: HIP + 8 });
  const pRip = ripplesFor(pruitt, 3);
  RD.animate(tl, pruitt, pk, { start: 0, end: DUR, onDraw: pRip });

  // --- V2: wades in last; heads straight for the puddle (left/forward) — stopped by Pruitt's arm, steps back
  const V2X = 1110;
  const v2k = [{ t: 0, pose: wadeA, x: 1830, y: HIP, facing: -1, face: "worried" }];
  wade(v2k, 0, 5.4, 1830, V2X + 150, HIP, HIP);
  v2k.push({ t: 5.9, pose: "idle", x: V2X + 150, y: HIP, face: "neutral" });
  v2k.push({ t: 7.4, pose: M("idle", { head: 6 }), x: V2X + 150, y: HIP });
  wade(v2k, 7.7, 9.3, V2X + 150, 1010, HIP, HIP + 14);
  v2k.push({ t: 9.45, pose: M("idle", { torso: -12, head: -10, lsh: 30, lel: 40, rsh: 40, rel: 50 }), x: 1004, y: HIP + 14, face: "o", ease: "power3.out" });   // stopped short
  v2k.push({ t: 10.2, pose: M("idle", { torso: -6, head: 10 }), x: 1020, y: HIP + 12, face: "scared" });                                                  // looks down at the wire
  wade(v2k, 10.5, 11.4, 1020, 1070, HIP + 12, HIP + 6);
  v2k.push({ t: 11.8, pose: M("idle", { head: 8 }), x: 1070, y: HIP + 6, face: "worried" });
  v2k.push({ t: 13.6, pose: M("idle", { head: 2 }), x: 1090, y: HIP + 6 });
  v2k.push({ t: 15.6, pose: M("idle", { head: 14, torso: 6 }), x: 1070, y: HIP + 6, face: "o" });
  v2k.push({ t: 16.5, pose: M("idle", { head: 10, torso: -8, lsh: -18, lel: 40, rsh: 30, rel: 50 }), x: 1084, y: HIP + 6, face: "scared" });
  v2k.push({ t: 19.6, pose: M("idle", { head: 12, torso: -6, lsh: -16, lel: 40, rsh: 28, rel: 52 }), x: 1090, y: HIP + 6 });
  const v2Rip = ripplesFor(v2, 4);
  RD.animate(tl, v2, v2k.filter((k, i, a) => !(i > 0 && k.t <= a[i - 1].t)), { start: 0, end: DUR, onDraw: v2Rip });

  // ---------------------------------------------------------------- water in FRONT of the shins + the downed line over it
  const fx = $("fx");
  const strip = [];
  for (let x = -40; x <= 1960; x += 40) strip.push([x, FEET - 12 + Math.sin(x * 0.03) * 2]);
  strip.push([1960, FEET + 16], [-40, FEET + 16]);
  sk.path(fx, strip, { closed: true, fill: P.steel, stroke: "none", seed: 1510, double: false, wobble: 0.8, opacity: 0.72 });
  sk.path(fx, strip.slice(0, -2), { stroke: P.fog, width: 2, seed: 1511, double: false, wobble: 0.8, opacity: 0.45 });
  // the part of the downed line lying on the lot is IN FRONT of the waders (they stay behind it)
  const LX0 = bg.powerLine.x0;
  sk.path(fx, [[LX0 + 40, 820], [LX0 + 6, 862], [800, 876], [700, 880], [620, 896], [540, 900], [480, 916], [452, 926], [LX, LY]], { stroke: P.ink, width: 3.4, seed: 1512, double: false, wobble: 1.0, step: 18 });

  // ---------------------------------------------------------------- the SPARK where the line lies in the puddle (from 15.1)
  const spG = el("g", { id: SID + "-spark" }, fx);
  const glow = el("circle", { cx: LX, cy: LY - 4, r: 10, fill: P.fog, opacity: 0 }, spG);
  const glow2 = el("circle", { cx: LX, cy: LY - 4, r: 6, fill: P.paper, opacity: 0 }, spG);
  const ring = el("ellipse", { cx: LX, cy: LY + 2, rx: 10, ry: 3, fill: "none", stroke: P.paper, "stroke-width": 2, opacity: 0 }, spG);
  const bolts = [0, 1, 2, 3, 4, 5, 6].map((i) => el("path", { fill: "none", stroke: i % 3 === 0 ? P.paper : i % 3 === 1 ? P.fog : P.mist, "stroke-width": i % 3 === 0 ? 4.6 : 3.2, "stroke-linecap": "round", "stroke-linejoin": "round" }, spG));
  const dots = [0, 1, 2, 3, 4, 5].map(() => el("circle", { r: 3.6, fill: P.paper }, spG));
  const BURSTS = [[15.0, 0.6, 0.9], [15.95, 0.25, 0.6], [16.7, 0.8, 1.0], [17.85, 0.35, 0.7], [18.5, 1.5, 1.0]];
  const sp = { t: 0 };
  const drawSpark = (t) => {
    let I = 0, since = 9;
    BURSTS.forEach(([b, d, a]) => {
      if (t >= b && t < b + d) I = Math.max(I, a * (0.75 + 0.25 * Math.sin((t - b) * 40)));
      if (t >= b) since = Math.min(since, t - b);
    });
    const fr = Math.floor(t * 24);
    const on = I > 0 && H(fr * 1.7 + 3) > -0.55;    // crackle: flickers frame to frame
    const k = on ? I : 0;
    const g0 = t >= 15.0 ? 0.14 : 0, gk = Math.max(k, I * 0.7);
    glow.setAttribute("r", f1(40 + 50 * gk)); glow.setAttribute("opacity", (g0 + 0.5 * gk).toFixed(3));
    glow2.setAttribute("r", f1(5 + 14 * gk)); glow2.setAttribute("opacity", (g0 * 3 + 0.95 * gk).toFixed(3));
    const ru = clamp01(since / 0.6);
    ring.setAttribute("rx", f1(10 + 70 * ru)); ring.setAttribute("ry", f1(3 + 12 * ru));
    ring.setAttribute("opacity", (t >= 15.0 ? (1 - ru) * 0.7 : 0).toFixed(3));
    bolts.forEach((b, i) => {
      if (!on || H(fr * 3.1 + i * 7.7) < -0.3) { b.setAttribute("d", ""); return; }
      const ang = -Math.PI * (0.08 + 0.84 * ((H(fr * 5.3 + i * 2.9) + 1) / 2)), len = (34 + 56 * ((H(fr + i * 11.3) + 1) / 2)) * (0.6 + 0.4 * k);
      let x = LX, y = LY - 4, d = `M${f1(x)} ${f1(y)}`;
      for (let s = 1; s <= 4; s++) {
        x = LX + Math.cos(ang) * len * s / 4 + H(fr * 7 + i * 13 + s) * 10;
        y = LY - 4 + Math.sin(ang) * len * s / 4 + H(fr * 9 + i * 17 + s) * 10;
        d += ` L${f1(x)} ${f1(y)}`;
      }
      b.setAttribute("d", d);
    });
    dots.forEach((dt, i) => {
      const u = ((since * 2.2 + i * 0.17) % 1);
      const live = I > 0 || since < 0.5;
      const a = -Math.PI * (0.2 + 0.6 * ((H(i * 4.1 + Math.floor(since * 2.2)) + 1) / 2)), v = 70 + 40 * ((H(i * 2.3) + 1) / 2);
      dt.setAttribute("cx", f1(LX + Math.cos(a) * v * u));
      dt.setAttribute("cy", f1(LY - 4 + Math.sin(a) * v * u + 120 * u * u));
      dt.setAttribute("opacity", (live && t >= 15.0 ? (1 - u) * 0.9 : 0).toFixed(3));
    });
  };
  drawSpark(0);
  tl.fromTo(sp, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => drawSpark(sp.t) }, 0);

  // ---------------------------------------------------------------- weather
  RD.rain(tl, fx, { start: 0, end: DUR, count: 140, opacity: 0.45, seed: 15 });

  // ---------------------------------------------------------------- camera: slow push-in, ending low on the door + spark
  const camEl = $("cam"), cp = { s: 1, x: 0, y: 0 };
  const camApply = () => camEl.setAttribute("transform", `translate(${f1(cp.x + 960 - 960 * cp.s)} ${f1(cp.y + 540 - 540 * cp.s)}) scale(${cp.s.toFixed(4)})`);
  function camKeys(keys) {
    Object.assign(cp, { s: keys[0][1], x: keys[0][2], y: keys[0][3] }); camApply();
    for (let i = 1; i < keys.length; i++) {
      const [t0, s0, x0, y0] = keys[i - 1], [t1, s1, x1, y1, ease] = keys[i];
      tl.fromTo(cp, { s: s0, x: x0, y: y0 }, { s: s1, x: x1, y: y1, duration: t1 - t0, ease: ease || "sine.inOut", immediateRender: false, onUpdate: camApply }, t0);
    }
  }
  camKeys([
    [0, 1.0, 0, 0],
    [8.0, 1.06, 20, -20, "sine.inOut"],
    [11.0, 1.12, 110, -50, "sine.inOut"],
    [15.0, 1.2, 190, -120, "sine.inOut"],
    [20.0, 1.45, 430, -260, "power1.inOut"],
  ]);

  window.__timelines["ep02-s15"] = tl;
})();
